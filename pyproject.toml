[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quartermaster-quota"
version = "0.3.0"
description = "Complete quota evidence, a compact terminal display, and native Claude consultations"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Darcy Rose"}]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console :: Curses",
]
dependencies = ["wcwidth>=0.2.13"]

[project.scripts]
quartermaster = "quartermaster.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quartermaster"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12", "pyte>=0.8.2"]

[tool.ruff]
line-length = 100
target-version = "py311"
